<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Neural Network Playground</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="theme-dark">
  <div class="auth-bg">
    <div class="auth-bg-shape auth-bg-shape-1"></div>
    <div class="auth-bg-shape auth-bg-shape-2"></div>
    <div class="auth-bg-shape auth-bg-shape-3"></div>
    <div class="auth-bg-dots">
      <span class="auth-bg-dot"></span>
      <span class="auth-bg-dot"></span>
      <span class="auth-bg-dot"></span>
      <span class="auth-bg-dot"></span>
      <span class="auth-bg-dot"></span>
    </div>
  </div>
  <div class="auth-page">
    <a href="index.html" class="auth-back">← Back to home</a>
    <div class="auth-card">
      <h1 class="auth-title">Sign in</h1>
      <p class="auth-sub">Welcome back. Sign in to continue.</p>
      <div class="auth-error" id="auth-error" role="alert"></div>
      <form class="auth-form" id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        <button type="submit" id="submit-btn">Sign in</button>
      </form>
      <p class="auth-footer">Don't have an account? <a href="signup.html">Register</a></p>
    </div>
  </div>
  <script>
    (function() {
      var form = document.getElementById('login-form');
      var err = document.getElementById('auth-error');
      var btn = document.getElementById('submit-btn');
      function showError(msg) {
        err.textContent = msg || '';
        err.classList.toggle('visible', !!msg);
      }
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;
        if (!email || !password) { showError('Please enter email and password.'); return; }
        showError('');
        btn.disabled = true;
        fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        }).then(function(r) { return r.json().then(function(data) { return { ok: r.ok, data: data }; }); })
          .then(function(result) {
            if (result.ok) {
              window.location.href = 'index.html';
              return;
            }
            showError(result.data && result.data.error ? result.data.error : 'Sign in failed.');
            btn.disabled = false;
          }).catch(function() {
            showError('Network error. Try again.');
            btn.disabled = false;
          });
      });
    })();
  </script>
</body>
</html>
