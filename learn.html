<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learn — Neural Network Playground</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <style>
    /* Override auth.css: full-width block layout */
    body.learn-body { display: block; margin: 0; min-height: 100vh; font-family: 'Space Grotesk', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 0; }
    body.learn-body.theme-light { --bg: #f5f5f4; --bg-card: #fff; --text: #1c1917; --text-muted: #57534e; --accent: #0d9488; --accent-soft: rgba(13,148,136,0.12); --border: #e7e5e4; }
    body.learn-body.theme-dark { --bg: #0c0a09; --bg-card: #1c1917; --text: #fafaf9; --text-muted: #a8a29e; --accent: #2dd4bf; --accent-soft: rgba(45,212,191,0.12); --border: #292524; }
    .learn-nav { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 1rem min(2rem, 4vw); background: var(--bg-card); border-bottom: 1px solid var(--border); box-sizing: border-box; }
    .learn-nav a { color: var(--text); text-decoration: none; font-weight: 500; }
    .learn-nav a:hover { color: var(--accent); }
    .learn-main { width: 100%; max-width: 100%; padding: 2rem min(2.5rem, 4vw); box-sizing: border-box; display: block; }
    .learn-intro { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; margin-bottom: 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    body.learn-body.theme-dark .learn-intro { box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .learn-title { font-size: 1.75rem; font-weight: 700; margin: 0 0 0.5rem; }
    .learn-sub { color: var(--text-muted); margin: 0; font-size: 1rem; line-height: 1.5; }
    .learn-section-title { font-size: 0.95rem; font-weight: 600; color: var(--text-muted); margin: 0 0 1rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .chapter-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.25rem; }
    .chapter-item { display: block; background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 1.35rem 1.5rem; text-decoration: none; color: var(--text); transition: border-color 0.2s, box-shadow 0.2s; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    body.learn-body.theme-dark .chapter-item { box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
    .chapter-item:hover { border-color: var(--accent); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    body.learn-body.theme-dark .chapter-item:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
    .chapter-item h3 { margin: 0 0 0.4rem; font-size: 1.1rem; font-weight: 600; }
    .chapter-meta { font-size: 0.85rem; color: var(--text-muted); }
    .chapter-meta .done { color: var(--accent); font-weight: 500; }
    .chapter-num { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; background: var(--accent-soft); color: var(--accent); border-radius: 10px; font-weight: 700; font-size: 0.95rem; margin-right: 0.75rem; vertical-align: middle; }
    .learn-loading { text-align: center; padding: 2.5rem; color: var(--text-muted); }
  </style>
</head>
<body class="learn-body theme-dark" id="learn-body">
  <nav class="learn-nav">
    <a href="index.html">← Neural Network Playground</a>
    <a href="profile.html">Profile</a>
  </nav>
  <main class="learn-main">
    <section class="learn-intro">
      <h1 class="learn-title">Learning path</h1>
      <p class="learn-sub">10 chapters on neural networks and deep learning. Read the content, then take the chapter quiz.</p>
    </section>
    <h2 class="learn-section-title">Chapters</h2>
    <div id="learn-loading" class="learn-loading">Loading chapters…</div>
    <ul class="chapter-list" id="chapter-list" style="display: none;"></ul>
  </main>
  <script>
    (function() {
      fetch('/api/auth/me', { credentials: 'include' }).then(function(r) {
        if (!r.ok) { window.location.href = 'login.html'; throw new Error(); }
        return fetch('/api/chapters', { credentials: 'include' });
      }).then(function(r) { return r.json(); }).then(function(data) {
        document.getElementById('learn-loading').style.display = 'none';
        var list = document.getElementById('chapter-list');
        list.style.display = 'grid';
        (data.chapters || []).forEach(function(c) {
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.className = 'chapter-item';
          a.href = 'chapter.html?id=' + c.id;
          var meta = [];
          if (c.completed_at) meta.push('<span class="done">Completed</span>');
          if (c.quiz_best) meta.push('Quiz: ' + c.quiz_best);
          a.innerHTML = '<span class="chapter-num">' + c.sort_order + '</span><h3>' + (c.title || 'Chapter') + '</h3><p class="chapter-meta">' + (meta.length ? meta.join(' · ') : 'Not started') + '</p>';
          li.appendChild(a);
          list.appendChild(li);
        });
      }).catch(function() {
        document.getElementById('learn-loading').textContent = 'Could not load. Sign in and try again.';
      });
    })();
  </script>
</body>
</html>
