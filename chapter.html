<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chapter — Neural Network Playground</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <style>
    body.chapter-body { margin: 0; min-height: 100vh; font-family: 'Space Grotesk', system-ui, sans-serif; background: var(--bg, #f5f5f4); color: var(--text, #1c1917); }
    body.chapter-body.theme-light { --bg: #f5f5f4; --bg-card: #fff; --text: #1c1917; --text-muted: #57534e; --accent: #0d9488; --accent-soft: rgba(13,148,136,0.12); --border: #e7e5e4; }
    body.chapter-body.theme-dark { --bg: #0c0a09; --bg-card: #1c1917; --text: #fafaf9; --text-muted: #a8a29e; --accent: #2dd4bf; --border: #292524; }
    .chapter-nav { display: flex; align-items: center; justify-content: space-between; padding: 1rem min(2rem, 4vw); background: var(--bg-card); border-bottom: 1px solid var(--border); }
    .chapter-nav a { color: var(--text); text-decoration: none; font-weight: 500; }
    .chapter-nav a:hover { color: var(--accent); }
    .chapter-main { width: 100%; max-width: 100%; padding: 2rem min(2.5rem, 4vw); box-sizing: border-box; }
    .chapter-inner { max-width: 900px; margin: 0 auto; }
    .chapter-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 1.75rem; margin-bottom: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .chapter-card h1 { font-size: 1.5rem; margin: 0 0 1rem; }
    .chapter-content { line-height: 1.7; color: var(--text); white-space: pre-wrap; margin-bottom: 1.5rem; }
    .chapter-section { margin-top: 1.5rem; }
    .chapter-section h3 { font-size: 1rem; margin: 0 0 0.5rem; color: var(--text-muted); }
    .chapter-links a { display: inline-block; margin-right: 0.75rem; margin-bottom: 0.5rem; padding: 0.5rem 1rem; background: var(--accent-soft, rgba(13,148,136,0.12)); color: var(--accent); border-radius: 8px; text-decoration: none; font-size: 0.9rem; }
    .chapter-links a:hover { opacity: 0.9; }
    .chapter-actions { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); }
    .chapter-actions a, .chapter-actions button { display: inline-block; padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600; font-family: inherit; border-radius: 10px; cursor: pointer; text-decoration: none; border: none; }
    .btn-quiz { background: var(--accent); color: #fff; margin-right: 0.75rem; }
    .btn-quiz:hover { opacity: 0.92; }
    .btn-back { background: transparent; color: var(--text-muted); }
    .btn-back:hover { color: var(--text); }
    .chapter-loading { text-align: center; padding: 2rem; color: var(--text-muted); }
  </style>
</head>
<body class="chapter-body theme-dark">
  <nav class="chapter-nav">
    <a href="learn.html">← Chapters</a>
    <a href="profile.html">Profile</a>
  </nav>
  <main class="chapter-main">
    <div class="chapter-inner">
      <div id="chapter-loading" class="chapter-card chapter-loading">Loading chapter…</div>
      <div id="chapter-content" style="display: none;">
        <div class="chapter-card">
          <h1 id="ch-title"></h1>
          <div class="chapter-content" id="ch-text"></div>
          <div class="chapter-section" id="ch-videos-wrap">
            <h3>Videos</h3>
            <div class="chapter-links" id="ch-videos"></div>
          </div>
          <div class="chapter-section" id="ch-docs-wrap">
            <h3>Documentation &amp; links</h3>
            <div class="chapter-links" id="ch-docs"></div>
          </div>
          <div class="chapter-actions">
            <a href="#" id="btn-quiz" class="btn-quiz">Take chapter quiz</a>
            <a href="learn.html" class="btn-back">Back to chapters</a>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script>
    (function() {
      var id = parseInt((window.location.search.match(/id=(\d+)/) || [])[1], 10);
      if (!id) { document.getElementById('chapter-loading').textContent = 'Invalid chapter.'; return; }
      fetch('/api/auth/me', { credentials: 'include' }).then(function(r) {
        if (!r.ok) { window.location.href = 'login.html'; throw new Error(); }
        return fetch('/api/chapters/' + id, { credentials: 'include' });
      }).then(function(r) { return r.json(); }).then(function(ch) {
        document.getElementById('chapter-loading').style.display = 'none';
        document.getElementById('chapter-content').style.display = 'block';
        document.getElementById('ch-title').textContent = ch.title || 'Chapter';
        document.getElementById('ch-text').textContent = ch.content_text || 'No content.';
        var videos = ch.video_links || [];
        var docs = ch.doc_links || [];
        var vWrap = document.getElementById('ch-videos-wrap');
        var dWrap = document.getElementById('ch-docs-wrap');
        var vEl = document.getElementById('ch-videos');
        var dEl = document.getElementById('ch-docs');
        videos.forEach(function(url) {
          var a = document.createElement('a');
          a.href = url;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = 'Video';
          vEl.appendChild(a);
        });
        if (!videos.length) vWrap.style.display = 'none';
        docs.forEach(function(url) {
          var a = document.createElement('a');
          a.href = url;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = 'Link';
          dEl.appendChild(a);
        });
        if (!docs.length) dWrap.style.display = 'none';
        document.getElementById('btn-quiz').href = 'quiz.html?chapterId=' + id;
        fetch('/api/chapters/' + id + '/start', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(function() {});
      }).catch(function() {
        document.getElementById('chapter-loading').textContent = 'Could not load chapter.';
      });
    })();
  </script>
</body>
</html>
